name: Sync project READMEs and deploy site

on:
  push:
    branches: [main]
  schedule:
    # Hourly, away from the busier start of the hour (UTC).
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Test README rendering
        run: bundle exec ruby scripts/test_project_readmes.rb
      - name: Fetch project READMEs
        run: bundle exec ruby scripts/sync_project_readmes.rb
      - name: Build website
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
