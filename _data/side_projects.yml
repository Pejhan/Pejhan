- title: "Trash Current Track"
  eyebrow: "Quod Libet plugin"
  description: >-
    A Quod Libet plugin that confirms before moving the current track to the trash
    and removing it from the library. Works with paused tracks; ignores streams
    and never permanently deletes files.
  image: "/assets/images/side-projects/trash-current.svg"
  image_alt: "Enhanced trash icon with a music note and keyboard shortcut keys"
  repository_url: "https://github.com/Pejhan/quodlibet-trash-current"
  readme_url: "https://github.com/Pejhan/quodlibet-trash-current#readme"
  live_url: ""

- title: "Playlist Shortcuts"
  eyebrow: "Quod Libet plugin"
  description: >-
    Add the current Quod Libet track to playlists with global keyboard shortcuts.
    Tracks can belong to multiple playlists; repeated presses never duplicate
    or remove them.
  image: "/assets/images/side-projects/playlist-shortcuts.svg"
  image_alt: "Enhanced favorite star icon over a playlist with keyboard shortcut keys"
  repository_url: "https://github.com/Pejhan/quodlibet-playlist-shortcuts"
  readme_url: "https://github.com/Pejhan/quodlibet-playlist-shortcuts#readme"
  live_url: ""

